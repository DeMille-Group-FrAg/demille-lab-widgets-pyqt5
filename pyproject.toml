[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "demille-lab-widgets-pyqt5"
version = "0.1.2"
description = "Improved PyQt5 widgets for laboratory control systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.9"
authors = [
    { name = "Olivier Grasdijk" },
    { name = "Jakob Kastelic" },
    { name = "Qian Wang" },
    { name = "Shaozhen Yang" },
]
keywords = ["PyQt5", "Qt", "widgets", "laboratory", "control-system"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "PyQt5>=5.15",
    "pyqtgraph>=0.12",
]

[project.urls]
Homepage = "https://github.com/DeMille-Group-FrAg/demille-lab-widgets-pyqt5"
Repository = "https://github.com/DeMille-Group-FrAg/demille-lab-widgets-pyqt5"
Issues = "https://github.com/DeMille-Group-FrAg/demille-lab-widgets-pyqt5/issues"

[project.optional-dependencies]
test = [
    "build>=1.2",
    "twine>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
